{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;

            background:
            linear-gradient(
                rgba(15,23,42,.75),
                rgba(15,23,42,.75)
            ),
            url("{% static 'images/library-bg.jpg' %}");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:450px;
            background:rgba(255,255,255,.95);
            padding:50px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .login-card i{
            font-size:60px;
            color:#2563eb;
            margin-bottom:20px;
        }

        .login-card h1{
            color:#111827;
            margin-bottom:10px;
        }

        .login-card p{
            color:#64748b;
            margin-bottom:25px;
        }

        .login-card form{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .login-card input{
            height:55px;
            border:1px solid #d1d5db;
            border-radius:12px;
            padding-left:15px;
            font-size:16px;
            outline:none;
        }

        .login-card input:focus{
            border-color:#2563eb;
        }

        .login-btn{
            height:55px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
        }

        .login-btn:hover{
            background:#1d4ed8;
        }

        .register-btn{
            display:block;
            margin-top:20px;
            padding:14px;
            background:#7c3aed;
            color:white;
            text-decoration:none;
            border-radius:12px;
            font-weight:600;
        }

        .register-btn:hover{
            background:#6d28d9;
        }

        .home-btn{
            display:block;
            margin-top:15px;
            padding:14px;
            background:#111827;
            color:white;
            text-decoration:none;
            border-radius:12px;
            font-weight:600;
        }

        .home-btn:hover{
            background:#374151;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <i class="fa-solid fa-book-open-reader"></i>

        <h1>Library Login</h1>

        <p>Sign in to access your library account</p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <a href="{% url 'register' %}" class="register-btn">
            Create New Account
        </a>

        <a href="/" class="home-btn">
            Back To Home
        </a>

    </div>

</body>
</html>
